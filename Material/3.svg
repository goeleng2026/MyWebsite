<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2E5C"/>
      <stop offset="60%" stop-color="#0A2647"/>
      <stop offset="100%" stop-color="#071A38"/>
    </linearGradient>

    <radialGradient id="glowGrad" cx="85%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#4FAAFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4FAAFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FAAFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4FAAFF" stop-opacity="0.03"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .ink { fill:#E8F0FB; font-family: 'Montserrat', system-ui, -apple-system, sans-serif; }
      .ink-dim { fill:#93A8C9; font-family: 'Montserrat', system-ui, -apple-system, sans-serif; }
      .signal { fill:#4FAAFF; }
      .card-stroke { stroke:#4FAAFF; stroke-opacity:0.22; }

      .fade-up {
        opacity:0;
        animation: fadeUp 0.7s ease-out forwards;
      }
      @keyframes fadeUp {
        from { opacity:0; transform: translateY(10px); }
        to   { opacity:1; transform: translateY(0); }
      }

      .pv-line {
        stroke-dasharray: 220;
        stroke-dashoffset: 220;
        animation: drawLine 3.6s ease-in-out infinite;
      }
      @keyframes drawLine {
        0%   { stroke-dashoffset: 220; }
        60%  { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; }
      }

      .ring {
        transform-origin: center;
        transform-box: fill-box;
        animation: ringPulse 2.4s ease-out infinite;
      }
      @keyframes ringPulse {
        0%   { transform: scale(1); opacity: 0.7; }
        100% { transform: scale(1.8); opacity: 0; }
      }

      .verified-dot {
        transform-origin: center;
        transform-box: fill-box;
        animation: dotGlow 1.8s ease-in-out infinite;
      }
      @keyframes dotGlow {
        0%,100% { transform: scale(1); opacity: 0.85; }
        50%     { transform: scale(1.3); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .fade-up, .pv-line, .ring, .verified-dot {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

  <!-- background panel -->
  <rect x="0" y="0" width="760" height="460" rx="18" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="760" height="460" rx="18" fill="url(#glowGrad)"/>
  <rect x="0.5" y="0.5" width="759" height="459" rx="17.5" fill="none" stroke="#4FAAFF" stroke-opacity="0.18"/>

  <!-- faint stars -->
  <circle cx="92" cy="58" r="1.4" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="612" cy="46" r="1.4" fill="#FFFFFF" opacity="0.22"/>
  <circle cx="700" cy="240" r="1.2" fill="#FFFFFF" opacity="0.2"/>
  <circle cx="58" cy="320" r="1.2" fill="#FFFFFF" opacity="0.18"/>
  <circle cx="350" cy="400" r="1.2" fill="#FFFFFF" opacity="0.15"/>

  <!-- PV/SP trend mark, top right -->
  <g transform="translate(574,40)">
    <path d="M0,46 L46,46 L58,24 L130,24" fill="none" stroke="#E8F0FB" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="3 3"/>
    <path class="pv-line" d="M0,40 C20,40 28,30 40,22 C55,12 70,18 130,16" fill="none" stroke="#4FAAFF" stroke-width="2.2" filter="url(#softGlow)"/>
  </g>

  <!-- eyebrow -->
  <text x="56" y="56" class="signal fade-up" style="animation-delay:0s" font-size="12" font-weight="700" letter-spacing="2.6" font-family="Montserrat, system-ui, sans-serif">AI-AUGMENTED ENGINEERING</text>

  <!-- headline -->
  <text x="56" y="102" class="ink fade-up" style="animation-delay:0.12s" font-size="29" font-weight="800">Deliverables built <tspan class="signal">fast</tspan>,</text>
  <text x="56" y="140" class="ink fade-up" style="animation-delay:0.12s" font-size="29" font-weight="800">checked for <tspan class="signal">accuracy</tspan>,</text>
  <text x="56" y="178" class="ink fade-up" style="animation-delay:0.12s" font-size="29" font-weight="800">trusted to be <tspan class="signal">reliable</tspan>.</text>

  <!-- three cards -->
  <!-- Card 1: Fast -->
  <g class="fade-up" style="animation-delay:0.45s">
    <rect x="56" y="222" width="200" height="150" rx="12" fill="url(#cardGrad)" class="card-stroke" stroke-width="1"/>
    <rect x="72" y="238" width="38" height="38" rx="10" fill="#4FAAFF" opacity="0.15"/>
    <rect x="72" y="238" width="38" height="38" rx="10" fill="none" stroke="#4FAAFF" stroke-width="1.5" class="ring" style="animation-delay:0s"/>
    <path d="M89,244 L80,258 L88,258 L86,270 L98,254 L90,254 Z" fill="#4FAAFF"/>
    <text x="72" y="296" class="ink" font-size="15" font-weight="700">Fast</text>
    <text x="72" y="316" class="ink-dim" font-size="11">Days, not weeks — automation</text>
    <text x="72" y="332" class="ink-dim" font-size="11">assists drafting and</text>
    <text x="72" y="348" class="ink-dim" font-size="11">calculation.</text>
  </g>

  <!-- Card 2: Error-Checked -->
  <g class="fade-up" style="animation-delay:0.62s">
    <rect x="280" y="222" width="200" height="150" rx="12" fill="url(#cardGrad)" class="card-stroke" stroke-width="1"/>
    <rect x="296" y="238" width="38" height="38" rx="10" fill="#4FAAFF" opacity="0.15"/>
    <rect x="296" y="238" width="38" height="38" rx="10" fill="none" stroke="#4FAAFF" stroke-width="1.5" class="ring" style="animation-delay:0.4s"/>
    <circle cx="315" cy="257" r="10" fill="none" stroke="#4FAAFF" stroke-width="2"/>
    <path d="M310,257 L314,261 L321,252" fill="none" stroke="#4FAAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="296" y="296" class="ink" font-size="15" font-weight="700">Error-Checked</text>
    <text x="296" y="316" class="ink-dim" font-size="11">Calculations cross-verified,</text>
    <text x="296" y="332" class="ink-dim" font-size="11">inconsistencies flagged</text>
    <text x="296" y="348" class="ink-dim" font-size="11">early.</text>
  </g>

  <!-- Card 3: Reliable -->
  <g class="fade-up" style="animation-delay:0.79s">
    <rect x="504" y="222" width="200" height="150" rx="12" fill="url(#cardGrad)" class="card-stroke" stroke-width="1"/>
    <rect x="520" y="238" width="38" height="38" rx="10" fill="#4FAAFF" opacity="0.15"/>
    <rect x="520" y="238" width="38" height="38" rx="10" fill="none" stroke="#4FAAFF" stroke-width="1.5" class="ring" style="animation-delay:0.8s"/>
    <path d="M539,241 L552,246 L552,258 C552,267 546,272 539,275 C532,272 526,267 526,258 L526,246 Z" fill="none" stroke="#4FAAFF" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="520" y="296" class="ink" font-size="15" font-weight="700">Reliable</text>
    <text x="520" y="316" class="ink-dim" font-size="11">Every output signed off by a</text>
    <text x="520" y="332" class="ink-dim" font-size="11">chartered engineer before</text>
    <text x="520" y="348" class="ink-dim" font-size="11">delivery.</text>
  </g>

  <!-- footer: RPEQ verified -->
  <g class="fade-up" style="animation-delay:1.0s">
    <circle class="verified-dot" cx="56" cy="404" r="4" fill="#5FE3A1" filter="url(#softGlow)"/>
    <text x="68" y="408" font-size="12" font-weight="700" letter-spacing="0.8" fill="#5FE3A1" font-family="Montserrat, system-ui, sans-serif">RPEQ VERIFIED</text>
    <line x1="186" y1="398" x2="186" y2="410" stroke="#93A8C9" stroke-opacity="0.3"/>
    <text x="198" y="408" class="ink-dim" font-size="12">Go Edgeless Engineering</text>
  </g>

</svg>